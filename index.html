<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1019">
  <meta name="description" content="A more personal way to learn, built around you.">
  <title>Adaptive Learning — Coming Soon</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b1019; color: #f7fbff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 2rem; background: radial-gradient(ellipse at 50% 35%, rgba(115,224,193,.16), transparent 38rem), #0b1019; }
    main { width: min(100%, 48rem); text-align: center; }
    .brand { color: #73e0c1; font-size: .82rem; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; }
    .mark { width: 4rem; height: 4rem; display: grid; place-items: center; margin: 2.25rem auto 1.5rem; border: 1px solid rgba(115,224,193,.45); border-radius: 1.3rem; background: rgba(115,224,193,.08); color: #73e0c1; font-size: 1.7rem; box-shadow: 0 0 2.5rem rgba(115,224,193,.15); }
    h1 { margin: 0; font-size: clamp(2.5rem, 8vw, 5rem); letter-spacing: -.065em; line-height: 1.02; }
    .status { margin: 1.25rem 0 .75rem; color: #73e0c1; font-size: .82rem; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
    .description { max-width: 34rem; margin: 0 auto; color: #b6c2d0; font-size: clamp(1rem, 2.5vw, 1.2rem); line-height: 1.7; }
    .social { display: flex; justify-content: center; gap: .75rem; margin-top: 2.5rem; }
    .social a { border: 1px solid rgba(255,255,255,.16); border-radius: 999px; padding: .7rem 1rem; color: #f7fbff; font-size: .9rem; font-weight: 650; text-decoration: none; transition: border-color .2s, background .2s; }
    .social a:hover { border-color: #73e0c1; background: rgba(115,224,193,.08); }
    footer { margin-top: 4rem; color: #758294; font-size: .8rem; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <div class="brand">HyperScale</div>
    <div class="mark" aria-hidden="true">H</div>
    <h1>Adaptive Learning</h1>
    <p class="status">Coming soon</p>
    <p class="description">A more personal way to learn, built around you.</p>
    <nav class="social" aria-label="Follow HyperScale">
      <a href="https://www.linkedin.com/company/hyperscal360/home/?viewAsMember=true" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="https://www.instagram.com/hyperscale360/" target="_blank" rel="noopener noreferrer">Instagram</a>
    </nav>
    <footer>© 2026 HyperScale</footer>
  </main>
</body>
</html>
